server:
  port: 8085

spring:
  application:
    name: gamification-service

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27019}/gamification_db
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    consumer:
      group-id: gamification-service     # третий читатель тех же топиков
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: kz.jazz.lms.events.DomainEvent

grpc:
  client:
    user-service:
      address: static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9091}
      negotiation-type: plaintext

jwt:
  secret: ${JWT_SECRET:jazzlms-super-secret-key-for-teaching-purposes-only-32b}
  gateway-token: ${GATEWAY_TOKEN:jazzlms-gateway-internal-token}   # признак «запрос пришёл через gateway»

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  level:
    kz.jazz.lms: DEBUG     # свой код пишем подробно: в Grafana видны DEBUG / INFO / WARN / ERROR
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
